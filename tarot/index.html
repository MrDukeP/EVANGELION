<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hermes Tarot</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#251a31,#09080d 55%);color:#f4efe5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100vh}.w{max-width:900px;margin:auto;padding:24px 15px 60px}h1{font-size:25px;margin:0 0 6px}.sub,.s{color:#aaa1b6}.p{background:#15121d;border:1px solid #302941;border-radius:18px;padding:17px;margin:14px 0}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{appearance:none;border:1px solid #70592f;background:#302315;color:#f7dfad;border-radius:13px;padding:13px 17px;font-size:16px;font-weight:750}button:disabled{opacity:.35}.t{font:800 24px ui-monospace,monospace}.stage{height:110px;position:relative;overflow:hidden}.back{position:absolute;width:62px;height:94px;left:50%;top:8px;margin-left:-31px;border:1px solid #d6b466;border-radius:8px;background:repeating-linear-gradient(45deg,#21172c 0 5px,#342440 5px 10px);opacity:0;box-shadow:0 10px 25px #0008}.stage.on .back{opacity:1}.stage.on .back:nth-child(1){animation:a .65s infinite}.stage.on .back:nth-child(2){animation:b .65s .08s infinite}.stage.on .back:nth-child(3){animation:c .65s .16s infinite}@keyframes a{50%{transform:translateX(-85px) rotate(-12deg)}}@keyframes b{50%{transform:translateX(85px) rotate(12deg)}}@keyframes c{50%{transform:translateY(-12px) scale(1.05)}}#sh.on{animation:p .7s alternate infinite}@keyframes p{to{box-shadow:0 0 28px #d6b46688}}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:#111019;border:1px solid #463b57;border-radius:14px;overflow:hidden;opacity:0;transform:translateY(25px) scale(.93);animation:in .55s cubic-bezier(.2,.8,.2,1) forwards}.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#191522}.card.rev img{transform:rotate(180deg)}.m{padding:9px}.en{font-size:11px;color:#bdb5c6}.o{font-size:12px;color:#d6b466;margin-top:5px}@keyframes in{to{opacity:1;transform:none}}code{font-size:11px;word-break:break-all;color:#ddc98f}@media(min-width:650px){.cards{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="w"><h1>Hermes Tarot · 固定牌池</h1><div class="sub">一次洗牌冻结完整 78 张牌序与正逆位。之后无放回抽取。</div><div class="p"><div class="r"><button id="sh">开始洗牌</button><div class="t" id="tm">0.000000 s</div><span class="s" id="st">尚未洗牌</span></div><div class="stage" id="stage"><i class="back"></i><i class="back"></i><i class="back"></i></div></div><div class="p"><div class="r"><button id="d1" disabled>抽 1 张</button><button id="d3" disabled>抽 3 张</button><button id="d7" disabled>抽到 7 张</button></div><div class="cards" id="cards"></div></div><div class="p s">Seed: <code id="seed">—</code><br>Deck SHA-256: <code id="hash">—</code></div></div><script>const majors=['愚者|The Fool','魔术师|The Magician','女祭司|The High Priestess','皇后|The Empress','皇帝|The Emperor','教皇|The Hierophant','恋人|The Lovers','战车|The Chariot','力量|Strength','隐者|The Hermit','命运之轮|Wheel of Fortune','正义|Justice','倒吊人|The Hanged Man','死神|Death','节制|Temperance','恶魔|The Devil','高塔|The Tower','星星|The Star','月亮|The Moon','太阳|The Sun','审判|Judgement','世界|The World'];const rz=['王牌|Ace','二|Two','三|Three','四|Four','五|Five','六|Six','七|Seven','八|Eight','九|Nine','十|Ten','侍从|Page','骑士|Knight','王后|Queen','国王|King'];const suits=[['权杖','Wands','wa'],['圣杯','Cups','cu'],['宝剑','Swords','sw'],['星币','Pentacles','pe']];let base=majors.map((x,i)=>{let[z,e]=x.split('|');return{z,e,f:'ar'+String(i).padStart(2,'0')+'.jpg'}});for(const[z,e,p]of suits)rz.forEach((x,i)=>{let[a,b]=x.split('|');base.push({z:z+a,e:b+' of '+e,f:p+String(i+1).padStart(2,'0')+'.jpg'})});const $=x=>document.getElementById(x),IMG='https://raw.githubusercontent.com/sixseeds/tarot-api/main/cards/';let run=0,start=0,raf,deck=[],ptr=0;async function H(s){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))}function u(b,o){return((b[o]<<24)|(b[o+1]<<16)|(b[o+2]<<8)|b[o+3])>>>0}function rot(x,k){return((x<<k)|(x>>>(32-k)))>>>0}function rng(s){let[a,b,c,d]=s;return()=>{let r=Math.imul(rot(Math.imul(b,5)>>>0,7),9)>>>0,t=(b<<9)>>>0;c^=a;d^=b;b^=c;a^=d;c^=t;d=rot(d,11);return r/4294967296}}async function make(seed){let h=await H('shuffle|'+seed),q=await H('orient|'+seed),R=rng([u(h,0),u(h,4),u(h,8),u(h,12)]),O=rng([u(q,0),u(q,4),u(q,8),u(q,12)]),a=base.map((x,i)=>({...x,id:i}));for(let i=77;i>0;i--){let j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}a.forEach(x=>x.rev=O()<.5);return a}function tick(){if(!run)return;$('tm').textContent=((performance.now()-start)/1000).toFixed(6)+' s';raf=requestAnimationFrame(tick)}function enable(v){['d1','d3','d7'].forEach(x=>$(x).disabled=!v)}function draw(){cards.innerHTML='';deck.slice(0,ptr).forEach((x,i)=>{let c=document.createElement('div');c.className='card '+(x.rev?'rev':'');c.style.animationDelay=(i*.08)+'s';c.innerHTML='<img src="'+IMG+x.f+'" alt="'+x.e+'"><div class="m"><b>#'+(i+1)+' '+x.z+'</b><div class="en">'+x.e+'</div><div class="o">'+(x.rev?'逆位':'正位')+'</div></div>';cards.appendChild(c)})}sh.onclick=async()=>{if(!run){run=1;start=performance.now();sh.textContent='结束洗牌';sh.classList.add('on');stage.classList.add('on');st.textContent='洗牌中';enable(0);tick()}else{run=0;cancelAnimationFrame(raf);sh.classList.remove('on');stage.classList.remove('on');let s=String(Math.max(1,Math.round((performance.now()-start)*1000)));seed.textContent=s;deck=await make(s);ptr=0;sh.textContent='重新洗牌';st.textContent='牌池已冻结';enable(1);let ser=deck.map(x=>x.id+':'+x.rev).join('|'),h=await H(ser);hash.textContent=[...h].map(x=>x.toString(16).padStart(2,'0')).join('')}};d1.onclick=()=>{ptr=Math.min(78,ptr+1);draw()};d3.onclick=()=>{ptr=Math.min(78,ptr+3);draw()};d7.onclick=()=>{ptr=Math.max(ptr,7);draw()}</script></body></html>
